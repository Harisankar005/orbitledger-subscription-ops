version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: brightloop-db
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: brightloop-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://brightloop:brightloop@db:5432/brightloop
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY environment variable must be explicitly set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_PRODUCTION_DEMO_OVERRIDE: ${ALLOW_PRODUCTION_DEMO_OVERRIDE:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      COOKIE_SAMESITE: strict
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: billing@brightloop.test
      EMBEDDED_WORKER: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop-worker
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://brightloop:brightloop@db:5432/brightloop
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY environment variable must be explicitly set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_PRODUCTION_DEMO_OVERRIDE: ${ALLOW_PRODUCTION_DEMO_OVERRIDE:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      COOKIE_SAMESITE: strict
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: billing@brightloop.test
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brightloop-web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
