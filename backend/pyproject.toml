[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitledger-backend"
version = "0.1.0"
description = "OrbitLedger Subscription Operations API"
requires-python = ">=3.12"
authors = [
    { name = "B. Harisankar", email = "nandubhari2@gmail.com" },
    { name = "Rohan S", email = "rohansnair5@gmail.com" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "apscheduler>=3.10.4",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
disallow_untyped_defs = false
warn_redundant_casts = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "assignment"]
