name: OrbitLedger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: brightloop
          POSTGRES_DB: brightloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint and typecheck backend
        run: |
          cd backend
          ruff check .
          mypy app

      - name: Run test suite with pytest
        env:
          DATABASE_URL: postgresql+psycopg://brightloop:brightloop@localhost:5432/brightloop_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          ENVIRONMENT: test
        run: |
          cd backend
          pytest -v --cov=app --cov=app/services tests/

      - name: Verify frontend API routes against OpenAPI schema
        run: |
          python scripts/verify_api_routes.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test

      - name: TypeScript typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build frontend
        run: |
          cd frontend
          npm run build
