version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: orbitledger-db
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: orbitledger-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbitledger-api
    command: sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://brightloop:brightloop@db:5432/brightloop}
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_PRODUCTION_DEMO_OVERRIDE: ${ALLOW_PRODUCTION_DEMO_OVERRIDE:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: billing@brightloop.test
      EMBEDDED_WORKER: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbitledger-worker
    command: python -m app.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://brightloop:brightloop@db:5432/brightloop}
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_PRODUCTION_DEMO_OVERRIDE: ${ALLOW_PRODUCTION_DEMO_OVERRIDE:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: billing@brightloop.test
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbitledger-web
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
