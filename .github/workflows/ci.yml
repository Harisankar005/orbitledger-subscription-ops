name: OrbitLedger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: brightloop
          POSTGRES_DB: brightloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint and typecheck backend
        run: |
          cd backend
          ruff check .
          mypy app

      - name: Run test suite with pytest
        env:
          DATABASE_URL: postgresql+psycopg://brightloop:brightloop@localhost:5432/brightloop_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          ENVIRONMENT: test
        run: |
          cd backend
          pytest -v --cov=app --cov=app/services tests/

      - name: Verify frontend API routes against OpenAPI schema
        run: |
          python scripts/verify_api_routes.py

      - name: Security audit with pip-audit (informational)
        run: |
          pip install pip-audit
          pip-audit backend/ || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test

      - name: TypeScript typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Security audit with npm audit (informational)
        run: |
          cd frontend
          npm audit --omit=dev || true

  postgres-concurrency:
    name: Concurrency on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: brightloop
          POSTGRES_DB: brightloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run concurrency tests against PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://brightloop:brightloop@localhost:5432/brightloop_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          ENVIRONMENT: test
        run: |
          cd backend
          pytest -v tests/concurrency/

  e2e-playwright:
    name: Playwright Golden Path E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          sleep 12
          docker compose exec -T api python -m app.seed --small --reset

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Playwright browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Golden Path
        env:
          PLAYWRIGHT_BASE_URL: http://localhost
        run: |
          cd frontend
          npx playwright test
